appId: com.origamix.app
productName: origamix
directories:
  buildResources: ../../build
  output: ../../release
files:
  - dist/**
  - '!dist/template/**'
extraResources:
  - from: ../../packages/app/dist
    to: app
  - from: dist/template
    to: template
mac:
  entitlementsInherit: ../../build/entitlements.mac.plist
  notarize: false
win:
  executableName: origamix
linux:
  target: [AppImage, snap, deb]
  category: Utility
npmRebuild: false
