pre-commit:
  jobs:
    - name: staged gate
      group:
        piped: true
        jobs:
          - name: format staged files
            glob: '*.{js,jsx,ts,tsx,cts,json,jsonc,css,md,mdx,yaml,yml,html}'
            run: pnpm exec prettier --write {staged_files}
            stage_fixed: true
          - name: lint staged code
            glob:
              - 'scripts/**/*.ts'
              - 'apps/**/*.{ts,tsx,cts}'
              - 'packages/**/*.{ts,tsx,cts}'
            run: pnpm exec eslint --fix {staged_files}
            stage_fixed: true
          - name: verify architecture rules
            glob:
              - 'packages/server/scripts/eslint-boundaries*.ts'
              - 'eslint.config.mjs'
            run: pnpm lint && pnpm --filter @origamix/server test:architecture
          - name: verify TypeScript changes
            glob:
              - 'scripts/**/*.ts'
              - 'apps/**/*.{ts,tsx,cts}'
              - 'packages/**/*.{ts,tsx}'
            run: pnpm build:libs && pnpm typecheck:prepared && pnpm test:prepared
