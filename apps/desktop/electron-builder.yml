appId: com.origamix.app
productName: OrigaMix
directories:
  buildResources: ../../build
  output: ../../release
files:
  - dist/**
  - dist/.env
  - '!dist/template/**'
  # Main, preload and Server are self-contained bundles.
  - '!node_modules/**'
extraResources:
  - from: ../../packages/app/dist
    to: app
  - from: dist/template
    to: template
mac:
  icon: icon.icns
  category: public.app-category.developer-tools
  minimumSystemVersion: '13.0'
  artifactName: '${productName}-${version}-macOS-${arch}.${ext}'
  target:
    - target: dmg
      arch: [arm64]
    - target: zip
      arch: [arm64]
  # Local trial builds: explicit ad-hoc signing, without certificate discovery.
  identity: '-'
  hardenedRuntime: false
  entitlements: ../../build/entitlements.mac.plist
  entitlementsInherit: ../../build/entitlements.mac.plist
  notarize: false
npmRebuild: false
