appId: com.origamix.app
productName: origamix
directories:
  buildResources: ../../build
  output: ../../release
files:
  - dist/**
  - '!dist/template/**'
  # Main, preload and Server are self-contained bundles.
  - '!node_modules/**'
extraResources:
  - from: ../../packages/app/dist
    to: app
  - from: dist/template
    to: template
mac:
  icon: icon-origamix.png
  entitlementsInherit: ../../build/entitlements.mac.plist
  notarize: false
win:
  icon: icon-origamix.png
  executableName: origamix
linux:
  icon: icon-origamix.png
  target: [AppImage, snap, deb]
  category: Utility
npmRebuild: false
